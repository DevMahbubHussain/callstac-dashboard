version: '3.8'

services:
  # Development setup with hot reload
  app-dev:
    image: node:18-alpine
    container_name: callstac-dev
    working_dir: /app
    ports:
      - "5173:5173"  # Vite dev server
      - "8000:8000"  # Laravel server
    volumes:
      - ./:/app
    command: sh -c "npm install && npm run dev"
    environment:
      - CHOKIDAR_USEPOLLING=true
    networks:
      - callstac-network

  # Database for development
  mysql-dev:
    image: mysql:8.0
    container_name: callstac-mysql-dev
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root_password
      - MYSQL_DATABASE=callstac_dev
      - MYSQL_USER=callstac_user
      - MYSQL_PASSWORD=callstac_password
    volumes:
      - mysql_dev_data:/var/lib/mysql
    networks:
      - callstac-network

networks:
  callstac-network:
    driver: bridge

volumes:
  mysql_dev_data:
    driver: local